    api_key_env: DEEPSEEK_API_KEY
    request_timeout_ms: 150000  # GLM coding 端点慢(reasoning模型,实测48s+),150s
    max_completion_tokens: 8192  # 思考型reasoning与content共享预算,2048易耗尽content空
    fallback: offline
    budget_max_input_chars: 0
    budget_max_latency_ms: 0
    budget_max_cost_cents: 0
    complex_intent_force_cloud: false
    pipeline_enable_rollback_hook: false
    external_provider: mock

  # DeepSeek 官方直连（模型 deepseek-flash = 当前会话所用）— 主力模型
  # v0.53.95: 原为腾讯 TokenHub 网关 + 模型名 deepseek-v4-flash-202605，
