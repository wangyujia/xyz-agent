<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zing Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #3d6fb4;
      --brand-deep: #2b5290;
      --bg: #f4f6fa;
      --line: #e2e8f1;
      --ok: #0da678;
      --bad: #d43d3d;
      --ink: #1f2d3d;
      --ink-soft: #5d7187;
      /* v6 主题 token（浅色默认） */
      --side-bg: linear-gradient(180deg, #22395c 0%, #1c3050 100%);
      --side-ink: #dce6f5;
      --side-ink-soft: #9db8d9;
      --side-ink-faint: #7e97bb;
      --side-item: #c3d3ea;
      --side-hover: rgba(255,255,255,0.08);
      --side-active: rgba(77,129,196,0.35);
      --side-line: rgba(255,255,255,0.09);
      --card-bg: #fff;
      --card-bg-soft: #f0f4fa;
      --card-bg-hover: #e8eff9;
      --card-line: #dbe5f1;
      --card-select-bg: #eef4fb;
      --bubble-user: linear-gradient(180deg,#e0f9c8,#d4f3b6);
      --bubble-user-ink: #243d24;
      --bubble-ink-head: #23486f;
      --code-bg: #edf3fb;
      --code-line: #d8e5f3;
      --link: #1f5e95;
      --quote-bg: #f5f9ff;
      --quote-ink: #355476;
      --warn-bg: #fff8ec;
      --warn-line: #f0d9a8;
      --warn-ink: #8a6410;
      --warn-chip-bg: #f3e7c8;
      --warn-chip-ink: #6b4e0e;
      --warn-no-line: #dfc890;
      --warn-no-hover: #fdf3dd;
      --banner-bg: #fdeeee;
      --banner-line: #f2caca;
      --main-bg: radial-gradient(1100px 460px at 18% -8%, rgba(61,111,180,0.05), transparent 60%), #eceff4;
      --hint-ink: #93a3b4;
      --send-disabled: #b9c6d6;
      --sb-thumb: #c3cfdd;
      --sb-thumb-hover: #a9b9cc;
      --typing-dot: #9db4d2;
      --warn-dot: #e8a23c;
      --sys-bubble-bg: #eef3f9;
      --sys-bubble-ink: #5a6b7d;
    }
    [data-theme="dark"] {
      --brand: #5a8fd4;
      --brand-deep: #7faee0;
      --bg: #10151d;
      --line: #2a3341;
      --ok: #12c58a;
      --bad: #e35d5d;
      --ink: #d7dfeb;
      --ink-soft: #93a3b8;
      --side-bg: linear-gradient(180deg, #141b26 0%, #0f141d 100%);
      --side-ink: #cdd9ec;
      --side-ink-soft: #8fa6c4;
      --side-ink-faint: #67799a;
      --side-item: #b6c6df;
      --side-hover: rgba(255,255,255,0.07);
      --side-active: rgba(90,143,212,0.32);
      --side-line: rgba(255,255,255,0.08);
      --card-bg: #1a2230;
      --card-bg-soft: #1c2634;
      --card-bg-hover: #232f41;
      --card-line: #2c3a4e;
      --card-select-bg: #21304a;
      --bubble-user: linear-gradient(180deg,#2c4225,#27391f);
      --bubble-user-ink: #c9e8b0;
      --bubble-ink-head: #9cc4ec;
      --code-bg: #202b3b;
      --code-line: #32415a;
      --link: #6cb0e8;
      --quote-bg: #1a2536;
      --quote-ink: #a4b8d4;
      --warn-bg: #2d2517;
      --warn-line: #4d3f22;
      --warn-ink: #e0b95e;
      --warn-chip-bg: #3a3020;
      --warn-chip-ink: #e0c689;
      --warn-no-line: #57482a;
      --warn-no-hover: #3a2f1c;
      --banner-bg: #381d1d;
      --banner-line: #5a2c2c;
      --main-bg: radial-gradient(1100px 460px at 18% -8%, rgba(90,143,212,0.07), transparent 60%), #131a24;
      --hint-ink: #5d6f86;
      --send-disabled: #3a465a;
      --sb-thumb: #3a4759;
      --sb-thumb-hover: #4d5d73;
      --typing-dot: #5d7492;
      --warn-dot: #e0a84e;
      --sys-bubble-bg: #1c2532;
      --sys-bubble-ink: #93a3b8;
    }
    /* 跟随系统（theme=auto 时生效——JS 设 data-theme=light/dark 前的兜底） */
    @media (prefers-color-scheme: dark) {
      html[data-theme="system"] { color-scheme: dark; }
    }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      height: 100vh;
      display: flex;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* ══ 侧栏 ══ */
    .sidebar {
      width: 250px;
      flex: none;
      background: var(--side-bg);
      color: var(--side-ink);
      display: flex;
      flex-direction: column;
    }
    .sidebar-head {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--side-line);
    }
    .sidebar-head h1 {
      font-size: 15.5px;
      font-weight: 650;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: #fff;
    }
    .sidebar-head h1::before {
      content: "";
      width: 20px; height: 20px;
      border-radius: 6px;
      background: rgba(255,255,255,0.14);
      box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.35);
    }
    .active-backend {
      margin-top: 12px;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 9px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      cursor: pointer;
    }
    .active-backend:hover { background: rgba(255,255,255,0.11); }
    .active-backend .ab-text { min-width: 0; flex: 1; }
    .active-backend .ab-name {
      font-size: 12.5px;
      font-weight: 650;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .active-backend .ab-status {
      margin-top: 2px;
      font-size: 11px;
      color: var(--side-ink-soft);
      line-height: 1.3;
    }
    .conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex: none;
      margin-top: 5px;
      background: var(--bad);
      box-shadow: 0 0 0 3px rgba(212,61,61,0.22);
      animation: pulse 2s infinite;
    }
    .conn-dot.on {
      background: var(--ok);
      box-shadow: 0 0 0 3px rgba(18,197,138,0.25);
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    .settings-field { margin-bottom: 14px; }
    .settings-field label {
      display: block;
      font-size: 12px;
      color: var(--ink-soft);
      margin-bottom: 5px;
    }
    .settings-field select, .settings-field .settings-meta {
      width: 100%;
    }
    .settings-field select {
      background: var(--card-bg-soft);
      color: var(--ink);
      border: 1px solid var(--card-line);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
    }
    .settings-meta {
      margin-top: 5px;
      font-size: 11.5px;
      color: var(--ink-soft);
      line-height: 1.35;
      word-break: break-all;
    }

    .settings-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(10, 14, 22, 0.45);
      backdrop-filter: blur(2px);
    }
    .settings-overlay.open { display: flex; justify-content: center; align-items: stretch; }
    .settings-page {
      width: min(520px, 100%);
      margin: 0 0 0 auto;
      background: var(--card-bg);
      color: var(--ink);
      border-left: 1px solid var(--line);
      box-shadow: -12px 0 40px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
      max-height: 100%;
    }
    .settings-page header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }
    .settings-page header h2 { font-size: 16px; font-weight: 650; }
    .settings-page header button {
      border: none;
      background: transparent;
      color: var(--ink-soft);
      font-size: 18px;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .settings-page header button:hover { background: var(--card-bg-hover); color: var(--ink); }
    .settings-page .settings-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px 28px;
    }
    .settings-section-title {
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 6px 0 10px;
    }

    .new-chat-btn {
      margin: 12px 12px 6px;
      padding: 9px;
      border: 1px dashed rgba(255,255,255,0.3);
      /* 深浅两态均白色虚线可读 */
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
      text-align: center;
    }
    .new-chat-btn:hover { background: rgba(255,255,255,0.13); }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
    }
    .session-item {
      padding: 9px 10px;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
      font-size: 12.5px;
      color: var(--side-item);
    }
    .session-item:hover { background: rgba(255,255,255,0.08); }
    .session-item.active {
      background: var(--side-active);
      color: #fff;
      font-weight: 600;
    }
    .session-item .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-item .del {
      visibility: hidden;
      color: var(--side-ink-soft);
      font-size: 12px;
      padding: 2px 5px;
      border-radius: 5px;
    }
    .session-item:hover .del { visibility: visible; }
    .session-item .del:hover { color: var(--bad); background: rgba(255,255,255,0.1); }

    .sidebar-foot {
      position: relative;
      padding: 10px 12px;
      border-top: 1px solid var(--side-line);
    }
    .user-menu-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      border: none;
      background: transparent;
      color: var(--side-ink);
      cursor: pointer;
      padding: 6px 6px;
      border-radius: 10px;
      text-align: left;
    }
    .user-menu-btn:hover { background: var(--side-hover); }
    .user-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #5a8fd4, #2b5290);
    }
    .user-menu-btn .user-meta { min-width: 0; flex: 1; }
    .user-menu-btn .user-name {
      font-size: 12.5px;
      font-weight: 600;
      color: #fff;
    }
    .user-menu-btn .user-sub {
      font-size: 10.5px;
      color: var(--side-ink-faint);
      margin-top: 1px;
    }
    .user-menu {
      display: none;
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: calc(100% + 6px);
      background: var(--card-bg);
      color: var(--ink);
      border: 1px solid var(--card-line);
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.22);
      padding: 6px;
      z-index: 40;
    }
    .user-menu.open { display: block; }
    .user-menu button {
      width: 100%;
      border: none;
      background: transparent;
      text-align: left;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--ink);
      cursor: pointer;
    }
    .user-menu button:hover { background: var(--card-bg-hover); }

    /* ══ 主区 ══ */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .banner {
      display: none;
      padding: 8px 16px;
      background: var(--banner-bg);
      color: var(--bad);
      font-size: 12.5px;
      border-bottom: 1px solid var(--banner-line);
      text-align: center;
    }
    .banner.show { display: block; }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--main-bg);
    }
    .msg { display: flex; gap: 10px; max-width: min(98%, 1120px); width: 100%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; width: auto; max-width: min(86%, 820px); }
    .msg.assistant { align-self: stretch; max-width: min(98%, 1120px); }
    .avatar {
      width: 30px; height: 30px;
      border-radius: 9px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #fff;
      font-weight: 700;
      margin-top: 2px;
    }
    .msg.user .avatar { background: linear-gradient(135deg,#5b8a3c,#4a7a30); }
    .msg.assistant .avatar { background: linear-gradient(135deg, var(--brand), var(--brand-deep)); }
    .bubble {
      border-radius: 14px;
      padding: 10px 13px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(30,58,95,0.06), 0 3px 10px rgba(30,58,95,0.05);
      max-width: 100%;
      min-width: 0;
      flex: 1;
    }
    .msg.user .bubble {
      background: var(--bubble-user);
      color: var(--bubble-user-ink);
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
      flex: none;
    }
    .msg.assistant .bubble {
      background: var(--card-bg);
      border-bottom-left-radius: 4px;
      white-space: normal;
    }
    .bubble h1,.bubble h2,.bubble h3 { margin: 6px 0 4px; color: var(--bubble-ink-head); }
    .bubble h1{font-size:17px}.bubble h2{font-size:15.5px}.bubble h3{font-size:14px}
    .bubble p { margin: 3px 0; }
    .bubble ul,.bubble ol { margin: 4px 0 4px 20px; }
    .bubble li { margin: 2px 0; }
    .bubble :not(pre) > code {
      font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
      background: var(--code-bg);
      border: 1px solid var(--code-line);
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 12.5px;
    }
    /* 贴近 llama-server WebUI 代码块 */
    .code-block {
      margin: 10px 0;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      background: #0d1117;
      color: #e6edf3;
    }
    .code-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 2px 6px 2px 10px;
      min-height: 22px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      font-size: 10.5px;
      line-height: 1;
      color: #7d8590;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      user-select: none;
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      font-weight: 500;
    }
    .code-block-head .code-copy {
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      color: #7d8590;
      border-radius: 4px;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }
    .code-block-head .code-copy svg {
      width: 13px;
      height: 13px;
      display: block;
    }
    .code-block-head .code-copy .ico-check { display: none; }
    .code-block-head .code-copy:hover { background: #21262d; color: #e6edf3; }
    .code-block-head .code-copy.copied { color: #3fb950; }
    .code-block-head .code-copy.copied .ico-copy { display: none; }
    .code-block-head .code-copy.copied .ico-check { display: block; }
    .code-block pre {
      margin: 0;
      padding: 10px 12px;
      overflow-x: auto;   /* 仅允许横向；纵向直接展开，不要内部滚动条 */
      overflow-y: visible;
      max-height: none;
      font-family: "Cascadia Code", "Cascadia Mono", "JetBrains Mono", "Fira Code",
                   Consolas, "Courier New", monospace;
      /* 气泡正文 14px；等宽字视觉偏大，略小一档 */
      font-size: 12.5px;
      line-height: 1.5;
      white-space: pre;
      background: transparent;
      border-radius: 0;
      /* 正文略降亮度，减少「一片白」 */
      color: #9da7b3;
      font-variant-ligatures: none;
      tab-size: 4;
    }
    .code-block pre code { background: none; border: none; color: inherit; padding: 0; font-size: inherit; font-family: inherit; }
    /* 贴近 llama-server：粉关键字 + 橙方法 + 蓝字面量/头文件 */
    .tok-k { color: #ff7b72; }    /* keyword */
    .tok-t { color: #79c0ff; }    /* STL / 类型名 */
    .tok-f { color: #ffa657; }    /* 函数 / 成员方法 */
    .tok-s { color: #a5d6ff; }    /* string */
    .tok-n { color: #79b8ff; }    /* number */
    .tok-l { color: #79c0ff; }    /* true/false/nullptr */
    .tok-c { color: #6e7681; }    /* comment */
    .tok-p { color: #ff7b72; }    /* #include */
    .tok-ph { color: #79c0ff; }   /* <iostream> */
    .tok-op { color: #ff7b72; }   /* 少量运算符 */
    .bubble a { color: var(--link); }
    .bubble blockquote {
      margin: 6px 0; padding: 4px 10px;
      border-left: 3px solid var(--code-line);
      background: var(--quote-bg); color: var(--quote-ink);
      border-radius: 4px;
    }
    .bubble hr {
      border: none; border-top: 1px solid var(--card-line);
      margin: 10px 0;
    }
    .bubble del { color: var(--hint-ink); }
    .md-table-wrap {
      margin: 8px 0;
      overflow-x: auto;
      border: 1px solid var(--card-line);
      border-radius: 8px;
      background: var(--card-bg-soft, var(--card-bg));
    }
    .md-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      line-height: 1.45;
      min-width: 480px;
    }
    .md-table th, .md-table td {
      padding: 6px 10px;
      border-bottom: 1px solid var(--card-line);
      border-right: 1px solid color-mix(in srgb, var(--card-line) 70%, transparent);
      vertical-align: top;
      white-space: nowrap;
    }
    .md-table th:last-child, .md-table td:last-child { border-right: none; }
    .md-table th {
      background: color-mix(in srgb, var(--card-bg-hover, #2a2f3a) 80%, transparent);
      color: var(--ink);
      font-weight: 600;
      font-size: 12px;
      position: sticky; left: 0;
    }
    .md-table tbody tr:last-child td { border-bottom: none; }
    .md-table tbody tr:hover td {
      background: color-mix(in srgb, var(--brand) 8%, transparent);
    }
    .md-table td:empty::after {
      content: '\00a0';
    }

    /* 工具调用折叠行 */
    .tool-chip {
      align-self: flex-start;
      max-width: min(96%, 1000px);
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg-soft);
      border: 1px solid var(--card-line);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 12px;
      color: var(--ink-soft);
      cursor: pointer;
      margin-left: 40px;
    }
    .tool-chip:hover { background: var(--card-bg-hover); }
    .tool-chip .tn { color: var(--brand-deep); font-weight: 650; }
    .tool-chip .chev { transition: transform .15s; font-size: 10px; }
    .tool-chip.open .chev { transform: rotate(90deg); }
    .tool-detail {
      display: none;
      max-width: min(96%, 960px);
      margin: -6px 0 6px 40px;
      background: #0f172a;
      color: #c9d8f0;
      border-radius: 10px;
      padding: 9px 11px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11.5px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 240px;
      overflow-y: auto;
    }
    .tool-detail.show { display: block; }

    /* 审批卡片 */
    .approval-card {
      align-self: flex-start;
      max-width: min(96%, 780px);
      background: var(--warn-bg);
      border: 1px solid var(--warn-line);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 13px;
      margin-left: 40px;
      box-shadow: 0 2px 8px rgba(180,140,50,0.12);
    }
    .approval-card .ac-title { font-weight: 700; color: var(--warn-ink); margin-bottom: 5px; }
    .approval-card .ac-tool {
      display: inline-block;
      background: var(--warn-chip-bg);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
      color: var(--warn-chip-ink);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .approval-card .ac-btns { display: flex; gap: 8px; margin-top: 8px; }
    .approval-card button {
      border: none;
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 12.5px;
      cursor: pointer;
      font-weight: 600;
    }
    .approval-card .yes { background: var(--ok); color: #fff; }
    .approval-card .yes:hover { filter: brightness(1.08); }
    
    .approval-card .no { border: 1px solid var(--warn-no-line); background: transparent; color: var(--warn-ink); }
    .approval-card .no:hover { background: var(--warn-no-hover); }

    .typing-row { align-self: flex-start; margin-left: 40px; display: flex; gap: 3px; padding: 10px 14px; background: var(--card-bg); border-radius: 14px 14px 14px 4px; box-shadow: 0 1px 3px rgba(30,58,95,0.08); }
    .thinking-stream { align-self: flex-start; margin: 4px 0 2px 40px; padding: 8px 12px; max-width: 78%; font-size: 12px; color: var(--side-ink-faint); background: var(--card-bg); border-left: 3px solid var(--accent); border-radius: 6px; white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow-y: auto; opacity: 0.92; }
    .typing-row span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--typing-dot);
      animation: bounce 1.4s infinite;
    }
    .typing-row span:nth-child(2){animation-delay:.2s}
    .typing-row span:nth-child(3){animation-delay:.4s}
    @keyframes bounce { 0%,80%,100%{opacity:.3;transform:translateY(0)} 40%{opacity:1;transform:translateY(-3px)} }

    .empty-hint {
      margin: auto;
      text-align: center;
      color: var(--hint-ink);
      font-size: 13px;
      line-height: 2;
    }
    .empty-hint .big { font-size: 34px; margin-bottom: 6px; }

    /* ══ 工具栏（图标）+ 上下文 ══ */
    .slash-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 14px 0;
      max-width: min(98%, 1120px);
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      position: relative;
    }
    .slash-tools {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tool-ico {
      width: 32px;
      height: 32px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-soft);
      border-radius: 8px;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .tool-ico svg { width: 16px; height: 16px; display: block; }
    .tool-ico:hover { background: var(--card-bg-hover); color: var(--ink); border-color: var(--card-line); }
    .tool-ico.danger:hover { color: var(--bad); }
    /* llama-server 风格：细线描边圆环（非实心甜甜圈），模型芯片左侧 */
    .ctx-ring-btn {
      --ring: rgba(255,255,255,0.78);
      width: 28px; height: 28px;
      padding: 0; margin: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
      border-radius: 50%;
      color: var(--ink-soft);
    }
    .ctx-ring-btn:hover { color: var(--ink); }
    .ctx-ring-btn svg.ctx-ring {
      width: 18px; height: 18px;
      display: block;
      transform: rotate(-90deg);
    }
    .ctx-ring-btn .track {
      fill: none;
      stroke: rgba(255,255,255,0.22);
      stroke-width: 2;
    }
    .ctx-ring-btn .prog {
      fill: none;
      stroke: var(--ring);
      stroke-width: 2;
      stroke-linecap: round;
      transition: stroke-dasharray .2s ease;
    }
    .ctx-ring-btn.warn { --ring: #e8a23c; }
    .ctx-ring-btn.hot { --ring: var(--bad); }
    [data-theme="light"] .ctx-ring-btn .track { stroke: rgba(0,0,0,0.18); }
    [data-theme="light"] .ctx-ring-btn { --ring: rgba(0,0,0,0.65); }
    .ctx-panel {
      display: none;
      position: absolute;
      right: 14px; bottom: calc(100% + 8px);
      width: min(320px, calc(100% - 28px));
      background: var(--card-bg);
      border: 1px solid var(--card-line);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.22);
      padding: 12px 14px;
      z-index: 50;
      color: var(--ink);
      font-size: 12.5px;
    }
    .ctx-panel.open { display: block; }
    .ctx-panel h4 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 650;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
    }
    .ctx-panel .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 3px 0;
      color: var(--ink-soft);
    }
    .ctx-panel .row b { color: var(--ink); font-weight: 560; }
    .ctx-panel .sep { height: 1px; background: var(--card-line); margin: 8px 0; }
    .ctx-panel .hint { color: var(--hint-ink); font-size: 11.5px; margin-top: 6px; line-height: 1.4; }
    .ctx-panel .ctx-compact {
      width: 100%; margin-top: 10px; border: 1px solid var(--card-line);
      background: var(--card-bg-soft); color: var(--ink); border-radius: 8px;
      padding: 7px 10px; font-size: 12.5px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .ctx-panel .ctx-compact:hover { border-color: var(--brand); color: var(--brand-deep); }
    .msg-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; max-width: 100%; }
    .msg.user .msg-body { align-items: flex-end; }
    .msg-meta {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      font-size: 11px; color: var(--hint-ink); padding: 0 2px;
    }
    .msg-meta .pill {
      border: 1px solid var(--card-line); border-radius: 999px;
      padding: 1px 7px; background: var(--card-bg-soft);
    }
    .msg-actions {
      display: flex; align-items: center; gap: 2px;
      opacity: 0.55; transition: opacity .15s;
    }
    .msg:hover .msg-actions, .msg-actions:focus-within { opacity: 1; }
    .msg-act {
      width: 28px; height: 28px; border: none; background: transparent;
      color: var(--ink-soft); border-radius: 7px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; padding: 0;
    }
    .msg-act svg { width: 14px; height: 14px; display: block; }
    .msg-act:hover { background: var(--card-bg-hover); color: var(--ink); }
    .msg-act.ok { color: var(--ok); }
    .input-wrap {
      position: relative;
      padding: 4px 14px 14px;
      max-width: min(98%, 1120px);
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .slash-hint {
      display: none;
      position: absolute;
      bottom: calc(100% - 6px);
      left: 22px; right: 22px;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      padding: 6px;
      z-index: 40;
      max-height: 190px;
      overflow-y: auto;
    }
    .sh-row {
      padding: 6px 10px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: baseline;
      font-size: 12.5px;
    }
    .sh-row:hover, .sh-row.first { background: var(--card-select-bg); }
    .sh-row b { color: var(--brand-deep); min-width: 66px; }
    .sh-row span { color: var(--ink-soft); font-size: 12px; }
    /* llama-server 风格输入框：大圆角卡片 + 底栏模型胶囊 + 圆形发送 */
    .input-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-line);
      border-radius: 22px;
      padding: 14px 14px 10px;
      box-shadow: 0 4px 22px rgba(0,0,0,0.08);
    }
    .input-box:focus-within {
      border-color: color-mix(in srgb, var(--brand) 55%, var(--card-line));
      box-shadow: 0 4px 24px rgba(0,0,0,0.12), 0 0 0 2px color-mix(in srgb, var(--brand) 18%, transparent);
    }
    textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-size: 15px;
      line-height: 1.45;
      font-family: inherit;
      min-height: 28px;
      max-height: 160px;
      background: transparent;
      color: var(--ink);
      padding: 0 4px;
    }
    textarea::placeholder { color: var(--hint-ink); }
    .composer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 2px;
    }
    .composer-left, .composer-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .composer-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--card-line);
      /* 双 linear-gradient 画十字，background-position:center 在 WebView2 下最稳 */
      background-color: transparent;
      background-image:
        linear-gradient(currentColor, currentColor),
        linear-gradient(currentColor, currentColor);
      background-size: 12px 2px, 2px 12px;
      background-position: center center, center center;
      background-repeat: no-repeat;
      color: var(--ink-soft);
      cursor: pointer;
      padding: 0;
      margin: 0;
      flex: none;
      line-height: 0;
      font-size: 0;
    }
    .composer-icon-btn:hover {
      background-color: var(--card-bg-hover);
      color: var(--ink);
    }
    .model-chip {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--card-line);
      background: var(--card-bg-soft);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px 6px 10px;
      font-size: 12.5px;
      font-weight: 560;
      cursor: pointer;
      max-width: 220px;
      user-select: none;
    }
    .model-chip:hover { border-color: var(--brand); }
    .model-chip:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .model-chip .cube {
      width: 14px; height: 14px;
      flex: none;
      opacity: 0.85;
    }
    .model-chip .chip-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .model-chip .chev {
      font-size: 10px;
      color: var(--ink-soft);
      margin-left: 2px;
    }
    .model-menu {
      display: none;
      position: absolute;
      right: 0;
      bottom: calc(100% + 8px);
      width: max(360px, 100%);
      min-width: 360px;
      max-width: min(480px, calc(100vw - 48px));
      background: var(--card-bg);
      border: 1px solid var(--card-line);
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.2);
      padding: 6px;
      z-index: 50;
      max-height: 280px;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .model-menu.open { display: block; }
    .model-menu .mm-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--ink);
      min-width: 0;
    }
    .model-menu .mm-item:hover { background: var(--card-select-bg); }
    .model-menu .mm-item.active { background: var(--card-select-bg); font-weight: 650; }
    .model-menu .mm-item .mm-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .model-menu .mm-item .mm-sub {
      font-size: 11px;
      color: var(--ink-soft);
      flex: 1 1 auto;
      min-width: 0;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .model-menu .mm-empty {
      padding: 10px;
      font-size: 12px;
      color: var(--ink-soft);
    }
    .send-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: var(--ink);
      color: var(--card-bg);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
      padding: 0;
    }
    .send-btn:hover { filter: brightness(1.12); }
    .send-btn:disabled { background: var(--send-disabled); cursor: not-allowed; filter: none; }
    .send-btn svg { width: 16px; height: 16px; display: block; }
    [data-theme="dark"] .send-btn {
      background: #e8eef7;
      color: #121820;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--sb-thumb); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--sb-thumb-hover); }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-head">
      <h1>Zing Agent</h1>
      <div class="active-backend" id="activeBackendRow" title="打开设置" onclick="openSettings()">
        <span id="connDot" class="conn-dot"></span>
        <div class="ab-text">
          <div class="ab-name" id="activeBackendName">本机后端</div>
          <div class="ab-status" id="connText">未连接</div>
        </div>
      </div>
      <div id="svcCard" style="display:none;margin-top:10px;padding:9px 10px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:9px;font-size:11.5px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="color:var(--side-ink-soft);">本机服务</span>
          <span id="svcState" style="font-weight:650;">…</span>
        </div>
        <div id="svcBtns" style="display:flex;gap:6px;margin-top:7px;">
          <button id="svcStartBtn" style="flex:1;border:none;border-radius:7px;padding:5px 0;background:var(--ok);color:#fff;cursor:pointer;font-size:11.5px;">启动</button>
          <button id="svcStopBtn" style="flex:1;border:none;border-radius:7px;padding:5px 0;background:rgba(255,255,255,0.14);color:var(--side-ink);cursor:pointer;font-size:11.5px;">停止</button>
        </div>
      </div>
    </div>
    <div id="remoteBox" style="display:none;margin:8px 12px;padding:9px 10px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:9px;font-size:11.5px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="color:var(--side-ink-soft);">远程后端</span>
        <button id="rbAddBtn" style="border:none;border-radius:6px;padding:2px 9px;background:rgba(255,255,255,0.14);color:var(--side-ink);cursor:pointer;font-size:11px;">＋添加</button>
      </div>
      <div id="rbList" style="margin-top:6px;"></div>
    </div>

    <div class="new-chat-btn" onclick="newSession()">＋ 新对话</div>
    <div class="session-list" id="sessionList"></div>
    <div class="sidebar-foot">
      <button type="button" class="user-menu-btn" id="userMenuBtn" aria-haspopup="menu" aria-expanded="false">
        <span class="user-avatar" aria-hidden="true">本</span>
        <span class="user-meta">
          <div class="user-name">本地用户</div>
          <div class="user-sub">点击打开菜单</div>
        </span>
      </button>
      <div class="user-menu" id="userMenu" role="menu">
        <button type="button" data-action="settings" role="menuitem">设置</button>
        <button type="button" data-action="theme" role="menuitem" id="themeBtn">切换主题</button>
      </div>
    </div>
  </div>

  <div class="settings-overlay" id="settingsPage" aria-hidden="true">
    <div class="settings-page" role="dialog" aria-label="用户设置">
      <header>
        <h2>用户设置</h2>
        <button type="button" id="settingsCloseBtn" title="关闭" aria-label="关闭">×</button>
      </header>
      <div class="settings-body">
        <div class="settings-section-title">后端与模型</div>
        <div class="settings-field">
          <label for="backendSel">连接后端</label>
          <select id="backendSel" onchange="onBackendChange()"></select>
          <div class="settings-meta" id="settingsBackendStatus">未连接</div>
        </div>
        <div class="settings-field">
          <label for="channelSel">模型通道</label>
          <select id="channelSel" onchange="onChannelChange()" disabled>
            <option value="">连接后加载…</option>
          </select>
          <div class="settings-meta" id="channelMeta">未选择</div>
        </div>
        <div class="settings-field">
          <label for="localModelSel">本地模型</label>
          <select id="localModelSel" onchange="onLocalModelChange()" disabled>
            <option value="">连接后加载…</option>
          </select>
          <div class="settings-meta" id="localModelMeta">进程内 GGUF</div>
        </div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="banner" id="banner"></div>
    <div class="messages" id="messages"></div>
    <div class="slash-bar">
      <div class="slash-tools">
        <button type="button" class="tool-ico" title="新对话" aria-label="新对话" onclick="newSession()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" class="tool-ico danger" title="停止" aria-label="停止" onclick="quickCmd('/stop')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button type="button" class="tool-ico" title="压缩上下文" aria-label="压缩上下文" onclick="quickCmd('/compact')">
          <!-- Lucide FoldVertical — llama.cpp webui Compact conversation 同款 (@lucide/svelte) -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22v-6"/>
            <path d="M12 8V2"/>
            <path d="M4 12H2"/>
            <path d="M10 12H8"/>
            <path d="M16 12h-2"/>
            <path d="M22 12h-2"/>
            <path d="m15 19-3-3-3 3"/>
            <path d="m15 5-3 3-3-3"/>
          </svg>
        </button>
        <button type="button" class="tool-ico" title="重试" aria-label="重试" onclick="quickCmd('/retry')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button type="button" class="tool-ico" title="帮助" aria-label="帮助" onclick="quickCmd('/help')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.8 2.1c-.8.5-1.3 1-1.3 1.9"/><path d="M12 17h.01"/></svg>
        </button>
      </div>
    </div>
    <div class="input-wrap" style="position:relative">
      <div class="ctx-panel" id="ctxPanel" role="dialog" aria-label="上下文详情">
        <h4><span>Context</span><span id="ctxPanelHead">—</span></h4>
        <div class="row"><span>已用</span><b id="ctxUsedPct">—</b></div>
        <div class="row"><span>剩余</span><b id="ctxRemain">—</b></div>
        <div class="sep"></div>
        <div class="row"><span>本会话 Prompt（估）</span><b id="ctxAllPrompt">0</b></div>
        <div class="row"><span>本会话 Generated（估）</span><b id="ctxAllGen">0</b></div>
        <div class="sep"></div>
        <div class="row"><span>本轮 Prompt</span><b id="ctxTurnPrompt">—</b></div>
        <div class="row"><span>本轮 Generated</span><b id="ctxTurnGen">—</b></div>
        <div class="row"><span>平均速度</span><b id="ctxSpeed">—</b></div>
        <div class="hint" id="ctxHint">基于本地估算；模型 n_ctx 来自 GGUF / llama-server。</div>
        <button type="button" class="ctx-compact" onclick="quickCmd('/compact'); closeCtxPanel();">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22v-6"/>
            <path d="M12 8V2"/>
            <path d="M4 12H2"/>
            <path d="M10 12H8"/>
            <path d="M16 12h-2"/>
            <path d="M22 12h-2"/>
            <path d="m15 19-3-3-3 3"/>
            <path d="m15 5-3 3-3-3"/>
          </svg>
          Compact conversation
        </button>
      </div>
      <div class="slash-hint" id="slashHint"></div>
      <div class="input-box">
        <textarea id="chatText" rows="1" placeholder="Type a message…"></textarea>
        <div class="composer-bar">
          <div class="composer-left">
            <button type="button" class="composer-icon-btn" id="composerPlusBtn" title="快捷命令" onclick="toggleSlashFromPlus()" aria-label="快捷命令"></button>
          </div>
          <div class="composer-right">
            <button type="button" class="ctx-ring-btn" id="ctxChip" title="上下文" aria-label="上下文" onclick="toggleCtxPanel(event)">
              <svg class="ctx-ring" id="ctxRing" viewBox="0 0 24 24" aria-hidden="true">
                <circle class="track" cx="12" cy="12" r="9"></circle>
                <circle class="prog" id="ctxRingProg" cx="12" cy="12" r="9"
                  stroke-dasharray="0 56.55"></circle>
              </svg>
            </button>
            <button type="button" class="model-chip" id="modelChip" disabled onclick="toggleModelMenu(event)">
              <svg class="cube" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M12 2.5 20 7v10l-8 4.5L4 17V7l8-4.5Z"/>

<script>
'use strict';

/* ══════════════ KV 存储（v7：webview=C++ 落盘 ~/.config/zing_agent/state.json；
   纯浏览器调试=localStorage 降级。data:URL 的 webview localStorage 是内存态，
   不落盘——实测 WebKitGTK）══════════════ */
const KV_HAS_BRIDGE = (typeof window.cfgGetAll === 'function');
const kvMem = {};          // 内存快照（同步读）
let kvLoaded = false;      // 预载完成标记（boot 等待）
const kvPending = [];      // 预载前的写请求排队

function kvGet(k, def = null) {
  const v = kvMem[k];
  return v === undefined ? def : v;
}
function kvSet(k, v) {
  kvMem[k] = String(v);
  if (!kvLoaded) { kvPending.push([k, String(v)]); return; }
  if (KV_HAS_BRIDGE) { try { window.cfgSet(JSON.stringify({ k, v: String(v) })); } catch (e) {} }
  else { try { localStorage.setItem(k, String(v)); } catch (e) {} }
}
function kvDel(k) {
  delete kvMem[k];
  if (!kvLoaded) { kvPending.push([k, null]); return; }
  if (KV_HAS_BRIDGE) { try { window.cfgDel(JSON.stringify({ k })); } catch (e) {} }
  else { try { localStorage.removeItem(k); } catch (e) {} }
}
async function kvLoad() {
  if (KV_HAS_BRIDGE) {
    try {
      const all = await window.cfgGetAll('{}');
      // webview 库 resolve 会自动反序列化 JSON——收到的可能已是对象
      const j = (typeof all === 'object' && all !== null) ? all : JSON.parse(all || '{}');
      Object.keys(j).forEach(k => { kvMem[k] = (typeof j[k] === 'string') ? j[k] : JSON.stringify(j[k]); });
    } catch (e) {}
  } else {
    try { Object.keys(localStorage).forEach(k => { kvMem[k] = localStorage.getItem(k); }); } catch (e) {}
  }
  kvLoaded = true;
  // 回放预载前的写
  while (kvPending.length) {
    const [k, v] = kvPending.shift();
    if (v === null) { if (KV_HAS_BRIDGE) { try { window.cfgDel(JSON.stringify({ k })); } catch (e) {} } else { try { localStorage.removeItem(k); } catch (e) {} } }
    else kvSet(k, v);
  }
}

/* ══════════════ 主题（v6：三态=系统/浅/深，记忆+即时切换）══════════════ */
const THEMES = ['system', 'light', 'dark'];
const THEME_ICON = { system: '🖥', light: '☀️', dark: '🌙' };
const THEME_LABEL = { system: '跟随系统', light: '浅色', dark: '深色' };
function applyTheme(mode, opts) {
  let effective = mode;
  if (mode === 'system') {
    effective = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', effective);
  // v7.1: 默认写穿；{persist:false} 用于启动首帧——kvMem 尚未预载，
  // 写会把用户已存主题覆盖为默认（kvPending 回放先于纠偏落盘）
  if (!opts || opts.persist !== false) kvSet('zing_theme', mode);
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = '主题 · ' + (THEME_LABEL[mode] || '跟随系统');
}
function cycleTheme() {
  const cur = kvGet('zing_theme', 'system') || 'system';
  const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
  applyTheme(next);
}

// 首帧即应用（防闪烁：script 在 body 尾但渲染前同步跑）
applyTheme(kvGet('zing_theme', 'system') || 'system', { persist: false });  // v7.1: 首帧不写盘（kvMem 未预载防覆盖）
// 系统主题实时跟随（仅 system 模式）
if (window.matchMedia) {
  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      let m = kvGet('zing_theme', 'system') || 'system';
      if (m === 'system') applyTheme('system');
    });
  } catch (e) {}
}

const _lexCache = Object.create(null);

function resolveLang(lang) {
  const key = String(lang || '').toLowerCase().trim();
  const meta = LANG_META[key];
  const fam = meta ? meta.fam : 'generic';
  const label = meta ? meta.label : (key ? key.toUpperCase() : 'CODE');
  return { key, fam, label };
}

function langLexicon(lang) {
  const { fam, label } = resolveLang(lang);
  if (_lexCache[fam]) return _lexCache[fam];
  const base = LANG_LEXICON[fam] || LANG_LEXICON.generic;
  const flags = base.style === 'sql' ? 'gi' : 'g';
  const parkAlt = '\\uE000\\d+\\uE001';
  const compiled = {
    fam,
    label,
    style: base.style,
    reLit: base.lits ? new RegExp(parkAlt + '|\\b(?:' + base.lits + ')\\b', flags) : null,
    reKw: base.kws ? new RegExp(parkAlt + '|\\b(?:' + base.kws + ')\\b', flags) : null,
    reTy: base.types ? new RegExp(parkAlt + '|\\b(?:' + base.types + ')\\b', flags) : null
  };
  _lexCache[fam] = compiled;
  return compiled;
}

function highlightCode(code, lang) {
  const lex = langLexicon(lang);
  // park：先占位再还原，避免后续 \bclass\b 误伤 span 的 class=
  const slots = [];
  const park = (html) => {
    const id = slots.length;
    slots.push(html);
    return '\uE000' + id + '\uE001';
  };
  const wrap = (cls, text) => park('<span class="' + cls + '">' + text + '</span>');
  const isPark = (m) => m.charCodeAt(0) === 0xE000;
  let s = esc(code);

  // 字符串 + 注释同一趟（字符串优先），避免 "http://..." / "...#..." 被注释规则吃掉
  const paintToken = (m) => {
    if (m.startsWith('/*') || m.startsWith('//') || m.startsWith('#') || m.startsWith('--'))
      return wrap('tok-c', m);
    return wrap('tok-s', m);
  };
  if (lex.style === 'py') {
    s = s.replace(/("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|#(?:[^\n]*))/g, paintToken);
  } else if (lex.style === 'sh') {
    s = s.replace(/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|#(?:[^\n]*))/g, paintToken);
  } else if (lex.style === 'sql') {
    s = s.replace(/(\/\*[\s\S]*?\*\/|--[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')/g, paintToken);
  } else if (lex.style === 'json') {
    s = s.replace(/"(?:\\.|[^"\\])*"/g, m => wrap('tok-s', m));
  } else {
    s = s.replace(/(\/\*[\s\S]*?\*\/|\/\/[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)/g, paintToken);
  }

  if (lex.fam === 'c' || lex.fam === 'cpp') {
    s = s.replace(/^(\s*#\s*include\s*)(&lt;[^&]+&gt;|\"[^\"]+\")/gm,
      (_, a, b) => wrap('tok-p', a) + wrap('tok-ph', b));
    s = s.replace(/^(\s*#\s*\w+[^\n]*)/gm, m =>
      m.indexOf('\uE000') >= 0 ? m : wrap('tok-p', m));
  }

  s = s.replace(/\uE000\d+\uE001|\b(0x[0-9a-fA-F]+|\d+\.\d+[fF]?|\d+[uUlL]*)\b/g, (m) =>
    isPark(m) ? m : wrap('tok-n', m));

  if (lex.reLit) s = s.replace(lex.reLit, (m) => isPark(m) ? m : wrap('tok-l', m));
  if (lex.reKw) s = s.replace(lex.reKw, (m) => isPark(m) ? m : wrap('tok-k', m));
  if (lex.reTy) s = s.replace(lex.reTy, (m) => isPark(m) ? m : wrap('tok-t', m));

  if (lex.style !== 'json' && lex.style !== 'sql') {
    s = s.replace(/(\.|-&gt;)([A-Za-z_]\w*)(?=\s*\()/g, (_, op, name) => op + wrap('tok-f', name));
    s = s.replace(/\uE000\d+\uE001|\b([A-Za-z_]\w*)(?=\s*\()/g, (m) =>
      isPark(m) ? m : wrap('tok-f', m));
    s = s.replace(/(&amp;&amp;|\|\||!=|==|&lt;=|&gt;=)/g, m => wrap('tok-op', m));
  }

  for (let i = 0; i < 10; i++) {
    const next = s.replace(/\uE000(\d+)\uE001/g, (_, id) => slots[Number(id)] || '');
    if (next === s) break;
    s = next;
  }
  return s;
}

const COPY_ICON =

function renderCodeBlock(lang, code) {
  const raw = String(code || '').replace(/\n$/, '');
  const { key, label } = resolveLang(lang);
  return '<div class="code-block" data-code="' + encodeURIComponent(raw) + '">' +

function splitMdTableRow(line) {
  let s = String(line || '').trim().replace(/\uFF5C/g, '|'); // 全角｜
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|')) s = s.slice(0, -1);
  return s.split('|').map(c => c.trim());
}
function isMdTableSep(line) {
  const cells = splitMdTableRow(line);
  // 模型常写 |:-:|（1 根短横）；GFM 规范是 3+，两边都收
  if (cells.length < 1) return false;
  return cells.every(c => /^:?-+:?$/.test(c));
}
function isMdTableRow(line) {
  const s = String(line || '').trim().replace(/\uFF5C/g, '|');
  if (!s || s.indexOf('|') < 0) return false;
  if (isMdTableSep(s)) return true;
  // 至少两列：a|b 或 |a|b|
  return splitMdTableRow(s).length >= 2;
}
function renderMdTable(block) {
  const lines = String(block || '').trim().split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length < 2 || !isMdTableSep(lines[1])) return '';
  const headers = splitMdTableRow(lines[0]);
  if (headers.length < 1) return '';
  const aligns = splitMdTableRow(lines[1]).map(c => {
    const L = c.startsWith(':'), R = c.endsWith(':');
    if (L && R) return 'center';
    if (R) return 'right';
    return 'left';
  });
  let html = '<div class="md-table-wrap"><table class="md-table"><thead><tr>';
  headers.forEach((h, i) => {
    html += '<th style="text-align:' + (aligns[i] || 'left') + '">' + h + '</th>';
  });
  html += '</tr></thead><tbody>';
  for (let i = 2; i < lines.length; i++) {
    if (!isMdTableRow(lines[i]) || isMdTableSep(lines[i])) continue;
    const cells = splitMdTableRow(lines[i]);
    html += '<tr>';
    for (let j = 0; j < headers.length; j++) {
      html += '<td style="text-align:' + (aligns[j] || 'left') + '">' + (cells[j] || '') + '</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}
/** 按行扫描抽出 GFM 表（比整块正则稳，流式半成品也能尽早成表） */
function extractMdTables(text) {
  const lines = String(text || '').split('\n');
  const out = [];
  const tables = [];
  let i = 0;
  while (i < lines.length) {
    const cur = lines[i];
    const nxt = i + 1 < lines.length ? lines[i + 1] : '';
    if (isMdTableRow(cur) && isMdTableSep(nxt) && splitMdTableRow(cur).length >= 1) {
      let j = i + 2;
      while (j < lines.length && isMdTableRow(lines[j]) && !isMdTableSep(lines[j])) j++;
      const html = renderMdTable(lines.slice(i, j).join('\n'));
      if (html) {
        const id = tables.length;
        tables.push(html);
        out.push('%%TABLE' + id + '%%');
        i = j;
        continue;
      }
    }
    out.push(cur);
    i++;
  }
  return { text: out.join('\n'), tables };
}

/* Markdown：先抽出代码块再排版；流式未闭合 ``` 也立即高亮 */
function mdToHtml(src = '') {
  const blocks = [];
  const take = (lang, code) => {
    const id = blocks.length;
    blocks.push(renderCodeBlock(String(lang || '').trim(), code));
    return '\n%%CODEBLOCK' + id + '%%\n';
  };
  let t = String(src || '').replace(/\r\n/g, '\n').replace(/\uFF5C/g, '|');
  t = t.replace(/```([^\n`]*)\n?([\s\S]*?)```/g, (_, lang, code) => take(lang, code));
  // 仅吞「仍以围栏开头的尾巴」，避免误伤正文里的孤立 ```
  t = t.replace(/(^|\n)```([^\n`]*)\n?([\s\S]*)$/g, (_, pre, lang, code) => pre + take(lang, code));
  t = esc(t);
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  t = t.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  t = t.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  t = t.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  t = t.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  t = t.replace(/^(-{3,}|\*{3,}|_{3,})\s*$/gm, '<hr>');
  const extracted = extractMdTables(t);
  t = extracted.text;
  const tables = extracted.tables;
  // 有序 / 无序列表整块包裹
  t = t.replace(/(?:(?:^|\n)\d+\. [^\n]+)+/g, (m) => {
    const items = m.trim().split('\n').map(l => l.replace(/^\d+\.\s+/, ''));
    return '\n<ol>' + items.map(i => '<li>' + i + '</li>').join('') + '</ol>\n';
  });
  t = t.replace(/(?:(?:^|\n)[-•*] [^\n]+)+/g, (m) => {
    const items = m.trim().split('\n').map(l => l.replace(/^[-•*]\s+/, ''));
    return '\n<ul>' + items.map(i => '<li>' + i + '</li>').join('') + '</ul>\n';
  });
  t = t.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  t = t.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/^(?!<[a-zA-Z/]|%%CODEBLOCK\d+%%|%%TABLE\d+%%)(.+)$/gm, '<p>$1</p>');
  t = t.replace(/<p><\/p>/g, '');
  t = t.replace(/\n{2,}/g, '\n');
  t = t.replace(/%%TABLE(\d+)%%/g, (_, i) => tables[Number(i)] || '');
  t = t.replace(/%%CODEBLOCK(\d+)%%/g, (_, i) => blocks[Number(i)] || '');
  return t;
}

function bindCodeCopy(root) {
  if (!root || root._codeCopyBound) return;
  root._codeCopyBound = true;
  root.addEventListener('click', (e) => {
    const btn = e.target.closest && e.target.closest('.code-copy');
    if (!btn) return;
    const block = btn.closest('.code-block');
    if (!block) return;
    let text = '';
    try { text = decodeURIComponent(block.getAttribute('data-code') || ''); } catch (_) {}
    const done = () => {
      btn.classList.add('copied');
      btn.title = '已复制';
      setTimeout(() => { btn.classList.remove('copied'); btn.title = '复制代码'; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (_) {}
        ta.remove(); done();
      });
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      ta.remove(); done();
    }
  });
}

function newSession() {
  const s = { id: uid(), name: '新对话', chat_id: 'zing-' + uid(), created: Date.now() };
  sessions.unshift(s);
  // v10: 会话数上限 50——超出淘汰最老且顺带清其消息键（防 KV 无限增长
  // 放大写放大；与消息 200 条 cap 同理）
  if (sessions.length > 50) {
    const dropped = sessions.splice(50);
    dropped.forEach(d => kvDel('zing_msgs_' + d.id));
  }
  saveSessions();
  switchSession(s.id);
}

function delSession(id) {
  sessions = sessions.filter(s => s.id !== id);
  kvDel('zing_msgs_' + id);  // v8: 无条件清——此前仅删活跃会话时清理,非活跃会话消息键永久泄漏
  if (activeId === id) {
    activeId = null;
    if (sessions.length) switchSession(sessions[0].id);
    else { renderSessionList(); renderMessages(); }
  }
  saveSessions();
  renderSessionList();
}

function switchSession(id) {
  activeId = id;
  kvSet('zing_active', activeId);  // v3/v7: 重启恢复最后活跃会话（C++ 落盘）
  saveSessions();
  renderSessionList();
  renderMessages();
}

function activeSession() { return sessions.find(s => s.id === activeId) || null; }

/* 消息本地存储（客户端展示层；服务端记忆由 chat_id 隔离） */
function loadMsgs(sid) {
  try { return JSON.parse(kvGet('zing_msgs_' + sid, '[]') || '[]'); } catch (e) { return []; }
}
function saveMsgs(sid, msgs) {
  kvSet('zing_msgs_' + sid, JSON.stringify(msgs.slice(-200)));
}
function pushMsgTo(sid, kind, text, extra) {
  const s = sessions.find(x => x.id === sid); if (!s) return;
  const msgs = loadMsgs(s.id);
  msgs.push(Object.assign({ kind, text, ts: Date.now(), _sid: sid }, extra || {}));
  // 会话名：首条用户消息截断
  if (s.name === '新对话' && kind === 'user') {
    s.name = text.slice(0, 16) + (text.length > 16 ? '…' : '');
    renderSessionList();
  }
  saveMsgs(s.id, msgs);
  if (sid === activeId) renderMessages();
}

function pushMsg(kind, text, extra) {
  pushMsgTo(activeId, kind, text, extra);
}
function patchLastAssistantMeta(meta) {
  const s = activeSession(); if (!s || !meta) return;
  const msgs = loadMsgs(s.id);
  for (let i = msgs.length - 1; i >= 0; i--) {
    if (msgs[i].kind !== 'assistant') continue;
    Object.assign(msgs[i], meta);
    if (msgs[i].tokens && msgs[i].latency_ms) {
      msgs[i].speed = Number(((msgs[i].tokens * 1000) / msgs[i].latency_ms).toFixed(2));
    }
    saveMsgs(s.id, msgs);
    noteTurnUsage({
      promptTok: ctxStats.lastPrompt || estimateTokens(lastUserTextForTurn()),
      genTok: msgs[i].tokens || estimateTokens(msgs[i].text || ''),
      latencyMs: msgs[i].latency_ms,
      model: msgs[i].model,
      nCtx: meta.n_ctx || ctxStats.n_ctx,
    });
    renderMessages();
    break;
  }
}

function renderMessages() {
  const box = $('messages');
  const s = activeSession();
  if (!s) {
    box.innerHTML = '<div class="empty-hint"><div class="big">💬</div>点击左侧「＋ 新对话」开始<br>也可以先在上方选择或输入后端地址</div>';
    return;
  }
  const msgs = loadMsgs(s.id);
  box.innerHTML = '';
  const streamingHere = streamingEl && streamingEl.sid === s.id;
  if (!msgs.length && !streamingHere && !typingEl) {
    box.innerHTML = '<div class="empty-hint"><div class="big">👋</div>有什么可以帮你？</div>';
    return;
  }
  msgs.forEach((m, i) => box.appendChild(buildMsgEl(m, i)));
  // v12: 流式行存活于重绘——流进行中收到 system/error/工具帧触发
  // pushMsgTo→全量重绘会吃掉流式气泡（streamingEl.row 悬空,显示丢帧）
  if (streamingEl && streamingEl.sid === s.id) box.appendChild(streamingEl.row);
  if (typingEl) box.appendChild(typingEl);  // v12: thinking 点存活于重绘（同类悬空）
  box.scrollTop = box.scrollHeight;
  refreshCtxFromSession();
}

function buildMsgEl(m, msgIndex) {

    acts.appendChild(mk('编辑', ICO.edit, () => {
      const ta = $('chatText');
      if (!ta) return;
      ta.value = String(m.text || '');
      ta.focus();
      ta.dispatchEvent(new Event('input'));

    if (m.kind === 'assistant') {
      acts.appendChild(mk('重新生成', ICO.regen, () => quickCmd('/retry')));

  return sys;
}

/* 流式气泡（v2: 记住流所属会话——切会话不串写） */
let streamingEl = null;
let thinkingBuf = '';  // v17: 真思考流缓冲(reasoning_content 增量)
function startStream(cmdId) {
  // v9: 单例流槽——新流顶替旧流时,旧 row 先落库再移除（孤儿流式行残留+
  // 文本丢失）;旧流无文本则直接弃
  if (streamingEl) {
    const prev = streamingEl;
    if (prev._mdTimer) clearTimeout(prev._mdTimer);
    streamingEl = null;
    prev.row.remove();
    if (prev.text.trim()) pushMsgTo(prev.sid, 'assistant', prev.text);
  }
  const box = $('messages');
  const row = document.createElement('div');
  row.className = 'msg assistant';
  row.innerHTML = '<div class="avatar">Z</div><div class="bubble streaming"></div>';
  box.appendChild(row);
  row.scrollIntoView({ block: 'end' });
  streamingEl = { row, bubble: row.querySelector('.bubble'), text: '', cmdId,
                  sid: activeId, t0: performance.now(),
                  promptTok: estimateTokens(lastUserTextForTurn()) };
}
function lastUserTextForTurn() {
  const s = activeSession();
  if (!s) return '';
  const msgs = loadMsgs(s.id);
  for (let i = msgs.length - 1; i >= 0; i--) {
    if (msgs[i].kind === 'user') return String(msgs[i].text || '');
  }
  return '';
}
function flushStreamMd() {
  if (!streamingEl) return;
  if (streamingEl._mdTimer) {
    clearTimeout(streamingEl._mdTimer);
    streamingEl._mdTimer = null;
  }
  if (streamingEl.sid !== activeId) return;
  streamingEl.bubble.innerHTML = mdToHtml(streamingEl.text);
  $('messages').scrollTop = $('messages').scrollHeight;
  streamingEl._lastMd = performance.now();
}
function appendStream(cmdId, chunk) {
  if (!streamingEl || streamingEl.cmdId !== cmdId) startStream(cmdId);
  streamingEl.text += chunk;
  // v8: 仅当视图仍在该流所属会话时渲染 DOM——切走后只积累,落库仍归原会话
  // 流式 md 节流：长代码 48ms；表格出现后加快，表头分隔行到达则立刻刷
  if (streamingEl.sid === activeId) {
    const chunkStr = String(chunk || '');
    const text = streamingEl.text;
    const tableSepHit = /\|[ \t]*:?-+:?[ \t]*(\|[ \t]*:?-+:?[ \t]*)+\|/.test(text.slice(-120));
    const inTable = tableSepHit || (text.indexOf('|') >= 0 && /\n[ \t]*\|/.test(text));
    if (tableSepHit && /\n/.test(chunkStr)) {
      flushStreamMd();
      return;
    }
    const gap = inTable ? 18 : 48;
    const now = performance.now();
    const due = gap - (now - (streamingEl._lastMd || 0));
    if (due <= 0 && !streamingEl._mdTimer) {
      flushStreamMd();
    } else if (!streamingEl._mdTimer) {
      streamingEl._mdTimer = setTimeout(flushStreamMd, Math.max(12, due));
    }
  }
}
let lastStreamedCmdId = '';
function endStream(cmdId, extraMeta) {
  if (streamingEl && streamingEl.cmdId === cmdId) {
    if (streamingEl._mdTimer) {
      clearTimeout(streamingEl._mdTimer);
      streamingEl._mdTimer = null;
    }
    const text = streamingEl.text;
    const sid = streamingEl.sid;   // v2: 流所属会话
    const latencyMs = Math.max(1, performance.now() - (streamingEl.t0 || performance.now()));
    const promptTok = streamingEl.promptTok || 0;
    const genTok = estimateTokens(text);
    const speed = genTok > 0 ? (genTok * 1000) / latencyMs : 0;
    streamingEl.row.remove();
    streamingEl = null;
    if (text.trim()) {
      const meta = Object.assign({
        tokens: genTok,
        latency_ms: Math.round(latencyMs),
        speed: Number(speed.toFixed(2)),
        model: ctxStats.model || '',
      }, extraMeta || {});
      if (extraMeta && extraMeta.latency_ms != null) {
        meta.latency_ms = extraMeta.latency_ms;
        meta.speed = meta.tokens > 0 && meta.latency_ms > 0
          ? Number(((meta.tokens * 1000) / meta.latency_ms).toFixed(2)) : meta.speed;
      }
      pushMsgTo(sid, 'assistant', text, meta);
      noteTurnUsage({
        promptTok, genTok: meta.tokens, latencyMs: meta.latency_ms,
        model: meta.model, nCtx: (extraMeta && extraMeta.n_ctx) || ctxStats.n_ctx,
      });
      lastStreamedCmdId = String(cmdId);
    }
  }
}

/* ── 上下文用量（llama-server 风格）── */
const ctxStats = {
  n_ctx: 0,
  mode: '',
  model: '',
  lastPrompt: 0,
  lastGen: 0,
  totalPrompt: 0,
  totalGen: 0,
  lastLatencyMs: 0,
  lastSpeed: 0,
};
function estimateTokens(s) {
  if (!s) return 0;
  let cjk = 0, other = 0;
  for (const ch of String(s)) {
    const c = ch.codePointAt(0) || 0;
    if ((c >= 0x4e00 && c <= 0x9fff) || (c >= 0x3400 && c <= 0x4dbf) ||
        (c >= 0x3040 && c <= 0x30ff) || (c >= 0xac00 && c <= 0xd7af)) cjk++;
    else if (c > 32) other++;
  }
  return cjk + Math.ceil(other / 4);
}
function fmtTok(n) {
  n = Math.max(0, Math.round(Number(n) || 0));
  if (n >= 10000) return (n / 1000).toFixed(2).replace(/\.?0+$/, '') + 'K';
  if (n >= 1000) return (n / 1000).toFixed(2) + 'K';
  return String(n);
}
function fmtSec(ms) {
  const s = Math.max(0, Number(ms) || 0) / 1000;
  if (s < 10) return s.toFixed(1) + 's';
  return Math.round(s) + 's';
}
function toggleCtxPanel(ev) {
  if (ev) ev.stopPropagation();
  const p = $('ctxPanel');
  if (!p) return;
  p.classList.toggle('open');
}
function closeCtxPanel() {
  const p = $('ctxPanel');
  if (p) p.classList.remove('open');
}
function renderCtxPanel() {
  const nCtx = ctxStats.n_ctx || 0;
  const turnUsed = (ctxStats.lastPrompt || 0) + (ctxStats.lastGen || 0);
  const sessUsed = (ctxStats.totalPrompt || 0) + (ctxStats.totalGen || 0);
  const usedRaw = turnUsed > 0 ? turnUsed : sessUsed;
  const used = nCtx > 0 ? Math.min(nCtx, usedRaw) : usedRaw;
  const pct = nCtx > 0 ? Math.min(100, Math.round((used / nCtx) * 100)) : 0;
  const remain = nCtx > 0 ? Math.max(0, nCtx - used) : 0;
  const ringBtn = $('ctxChip');
  const prog = $('ctxRingProg');
  // 细线圆环进度（模型芯片左侧）；点开看详情
  const tip = nCtx > 0
    ? (fmtTok(used) + ' / ' + fmtTok(nCtx) + (pct ? (' · ' + pct + '%') : ''))
    : (fmtTok(used) + ' tok');
  if (ringBtn) {
    ringBtn.title = tip || '上下文';
    ringBtn.classList.remove('warn', 'hot');
    if (pct >= 85) ringBtn.classList.add('hot');
    else if (pct >= 60) ringBtn.classList.add('warn');
  }
  if (prog) {
    const C = 2 * Math.PI * 9; // r=9 → ~56.55
    const p = Math.max(0, Math.min(100, pct));
    // 0% = 完全空环（仅 track）；有占用才画进度弧
    const len = C * p / 100;
    prog.setAttribute('stroke-dasharray', len.toFixed(2) + ' ' + C.toFixed(2));
    prog.style.opacity = p > 0 ? '1' : '0';
  }
  const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  set('ctxPanelHead', nCtx > 0 ? (fmtTok(used) + ' / ' + fmtTok(nCtx)) : fmtTok(used));
  set('ctxUsedPct', nCtx > 0 ? (pct + '% used') : '—');
  set('ctxRemain', nCtx > 0 ? (fmtTok(remain) + ' remaining') : '—');
  set('ctxAllPrompt', fmtTok(ctxStats.totalPrompt) + ' tok');
  set('ctxAllGen', fmtTok(ctxStats.totalGen) + ' tok');
  set('ctxTurnPrompt', ctxStats.lastPrompt ? (fmtTok(ctxStats.lastPrompt) + ' tok') : '—');
  set('ctxTurnGen', ctxStats.lastGen ? (fmtTok(ctxStats.lastGen) + ' tok') : '—');
  set('ctxSpeed', ctxStats.lastSpeed ? (Number(ctxStats.lastSpeed).toFixed(2) + ' t/s') : '—');
  const hint = $('ctxHint');
  if (hint) {
    hint.textContent = ctxStats.model
      ? ('模型 ' + ctxStats.model + (nCtx ? (' · n_ctx=' + nCtx) : '') + ' · 占用为估算')
      : (nCtx ? ('n_ctx=' + nCtx + ' · 占用为估算') : '等待模型 n_ctx（sidecar / GGUF）…');
  }
}
function refreshCtxFromSession() {
  const s = activeSession();
  if (!s) { renderCtxPanel(); return; }
  const msgs = loadMsgs(s.id);
  let prompt = 0, gen = 0;
  msgs.forEach(m => {
    const t = estimateTokens(m.text || '');
    if (m.kind === 'user') prompt += t;
    else if (m.kind === 'assistant') gen += (m.tokens || t);
  });
  ctxStats.totalPrompt = prompt;
  ctxStats.totalGen = gen;

    // 尚无本轮数据时，用会话合计近似占用
  }

}

  if (genTok != null) ctxStats.lastGen = genTok;
  if (latencyMs != null) {

  const s = activeSession(); if (!s) return;
  const msgs = loadMsgs(s.id);

  const slice = msgs.slice(0, idx + 1).map(m => Object.assign({}, m));
  newSession();

// v3: 30s 心跳——远程 NAT 空闲掐连主动探测；60s 无帧判死连接触发重连

    if (Date.now() - lastFrameTs > 60000) {
      try { ws.close(); } catch (e) {}  // 静默死——踢给 onclose 走重连
      return;
    }
    try { ws.send(JSON.stringify(Object.assign({ type: 'ping' }, mkMeta()))); } catch (e) {}
  }
}, 30000);

function scheduleReconnect() {
  if (reconnectTimer) return;
  const delay = Math.min(1000 * Math.pow(2, reconnectAttempts++), 30000);
  showBanner('连接已断开，' + Math.round(delay / 1000) + 's 后自动重连…');
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connectWs();
  }, delay);
}

function disconnectWs(silent) {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (ws) { const w = ws; ws = null; w.onclose = null; w.close(); }
  // v13: 手动断开（切后端）同样收尾流式态——流已死,半截文本落库标注
  if (streamingEl) {
    const dead = streamingEl;
    streamingEl = null;
    dead.row.remove();
    if (dead.text.trim()) pushMsgTo(dead.sid, 'assistant', dead.text + '\n\n*（连接已切换，回复中断）*');
  }
  hideTyping();
  if (!silent) setConn(false);
}

function mkMeta() {

  // v17: 进程纪元前缀——seq 重启归 1,纯 seq 会与服务端幂等键(idem 含
  // cmd_id)跨重启碰撞→submit_task 返回旧任务。Date.now() 保证跨重启唯一。
  const epoch = mkMeta._epoch || (mkMeta._epoch = Date.now());
  return { cmd_id: 'zing-' + epoch + '-' + seq, trace_id: 'zing-' + epoch + '-' + seq };
}
function sendRaw(payload, sid) {
